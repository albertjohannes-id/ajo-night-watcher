name: Bump version

# Rule: every push to main auto-increments the PATCH digit of VERSION
# (e.g. 1.0.0 -> 1.0.1). The bump commit carries [skip ci] so this
# workflow does not trigger itself. For minor/major bumps, run
# ./scripts/bump-version.sh minor|major locally and push.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump patch version
        run: ./scripts/bump-version.sh patch
      - name: Commit and push back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet && echo "No version change." || {
            git commit -m "Bump version to $(cat VERSION) [skip ci]"
            git push
          }
